<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer Navy Crest Ring -->
  <circle cx="24" cy="24" r="23" fill="#0f172a" stroke="#1e3a8a" stroke-width="2"/>
  <circle cx="24" cy="24" r="20" fill="#1e293b"/>
  <!-- Golden circular gear/track accents -->
  <circle cx="24" cy="24" r="18.5" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <circle cx="24" cy="24" r="16" fill="#1e40af"/>
  
  <!-- Locomotive Pantograph / TRD OHE -->
  <path d="M21 11h6M24 11v3" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Locomotive Front Body -->
  <rect x="14" y="14" width="20" height="18" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
  <!-- Twin Cab Windshield -->
  <rect x="16.5" y="16.5" width="6.5" height="5" rx="1" fill="#0284c7"/>
  <rect x="25" y="16.5" width="6.5" height="5" rx="1" fill="#0284c7"/>
  
  <!-- Indian Tricolor Ribbon -->
  <rect x="14" y="23" width="20" height="1.3" fill="#ff9933"/>
  <rect x="14" y="24.3" width="20" height="1.3" fill="#ffffff"/>
  <rect x="14" y="25.6" width="20" height="1.3" fill="#138808"/>
  
  <!-- High Intensity Headlight -->
  <circle cx="24" cy="29" r="2" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
  <circle cx="24" cy="29" r="0.8" fill="#ffffff"/>
  
  <!-- Buffer Beam & Pilot Cowcatcher -->
  <path d="M13 32h22l-2.5 4h-17z" fill="#dc2626"/>
  
  <!-- Railway Track & Sleepers -->
  <line x1="12" y1="39" x2="36" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="43" x2="33" y2="43" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="38" x2="14" y2="44" stroke="#cbd5e1" stroke-width="1.8"/>
  <line x1="24" y1="38" x2="24" y2="44" stroke="#cbd5e1" stroke-width="1.8"/>
  <line x1="31" y1="38" x2="34" y2="44" stroke="#cbd5e1" stroke-width="1.8"/>
</svg>
